services:
  # Backend API
  - type: web
    name: campus-connect-api
    runtime: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: backend

    envVars:
      - key: FLASK_ENV
        value: production

      - key: SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: campus-connect-db
          property: connectionString

      - key: CORS_ORIGINS
        sync: false

      - key: MATERIAL_UPLOAD_DIR
        value: /app/uploads/materials

  # Frontend
  - type: web
    name: campus-connect-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist

    routes:
      - type: rewrite
        source: /api/*
        destination: https://campus-connect-api.onrender.com/api/*

databases:
  - name: campus-connect-db
    plan: free
