services:
  - type: web
    name: campus-connect-api
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: campus-connect-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: MATERIAL_UPLOAD_DIR
        value: "/app/uploads/materials"

  - type: static
    name: campus-connect-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://campus-connect-api.onrender.com/api/*

databases:
  - name: campus-connect-db
    plan: free
