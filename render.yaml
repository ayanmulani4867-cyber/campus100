services:
  - type: web
    name: campus-connect
    runtime: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "gunicorn --chdir backend run:app"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: campus-connect-db
          property: connectionString
      - key: FRONTEND_DIR
        value: "../frontend"
      - key: MATERIAL_UPLOAD_DIR
        value: "../uploads/materials"

databases:
  - name: campus-connect-db
    plan: free
